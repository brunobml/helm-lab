apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop-api.name" . }}
  labels:
    {{- include "shop-api.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "shop-api.selectorLabels" . | nindent 4 }}
