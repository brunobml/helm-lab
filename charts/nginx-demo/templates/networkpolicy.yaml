{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nginx-demo.deploymentName" . }}
  labels:
    {{- include "nginx-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nginx-demo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Pods in the release's own namespace (for example the helm test Pod).
        - podSelector: {}
        {{- range .Values.networkPolicy.allowedNamespaces }}
        # Pods in an explicitly allowed namespace (for example the Ingress controller's).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort | default 80 }}
  egress:
    # Allow DNS queries to kube-dns/CoreDNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
