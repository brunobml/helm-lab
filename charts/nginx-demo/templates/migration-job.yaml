{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "nginx-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "nginx-demo.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.migration.image }}"
          command: ["sh", "-c"]
          args:
            - |
              echo "Running migration for release {{ .Release.Name }} (revision {{ .Release.Revision }})"
              sleep 2
              {{- if .Values.migration.fail }}
              echo "Migration failed on purpose" >&2
              exit 1
              {{- end }}
              echo "Migration complete"
{{- end }}
