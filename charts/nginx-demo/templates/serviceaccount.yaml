{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nginx-demo.serviceAccountName" . }}
  labels:
    {{- include "nginx-demo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# NGINX never calls the Kubernetes API, so don't mount a token into its Pods.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken | default false }}
{{- end }}
