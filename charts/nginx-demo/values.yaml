# replicaCount controls how many NGINX Pods the Deployment runs.
replicaCount: 2

image:
  repository: nginx
  # Explicit application version; use a digest for immutable image identity.
  tag: "1.30.4-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # port is the Service's listening port; it may differ from the container port.
  port: 80
  # targetPort must match NGINX's listening port. This does not configure NGINX.
  targetPort: 80

extraEnv: {}

resources: {}

pageContent: |
  <h1>Hello from Helm Lab</h1>

lab-banner:
  enabled: true
  message: Hello from the parent

global:
  environment: local

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

livenessProbe:
  httpGet:
    path: /
    port: 80

readinessProbe:
  httpGet:
    path: /
    port: 80

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

existingSecret: ""
