# -- replicaCount controls how many NGINX Pods the Deployment runs.
replicaCount: 2

image:
  # -- Image repository (unprivileged nginx to allow rootless operation)
  repository: nginxinc/nginx-unprivileged
  # -- Explicit application version; use a digest for immutable image identity.
  tag: "1.27-alpine"
  # -- Image pull policy
  pullPolicy: IfNotPresent

service:
  # -- Kubernetes Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service port exposed inside the cluster
  port: 80
  # -- Target port container listens on (unprivileged nginx defaults to 8080)
  targetPort: 8080

# -- Extra environment variables for the NGINX container.
extraEnv: {}

# -- CPU and memory resource requests and limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# -- Pod-level security context configuration for Pod Security restricted profile.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context configuration for Pod Security restricted profile.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 101

# -- PodDisruptionBudget configuration for high availability during node maintenance.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# -- NetworkPolicy configuration for network micro-segmentation.
networkPolicy:
  enabled: false

# -- Topology spread constraints to distribute Pods across zones/nodes.
topologySpreadConstraints: []

# -- Custom HTML content for the demo index page.
pageContent: |
  <h1>Hello from Helm Lab</h1>

lab-banner:
  enabled: true
  message: Hello from the parent

global:
  environment: local

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# -- Liveness probe configuration.
livenessProbe:
  httpGet:
    path: /
    port: 8080

# -- Readiness probe configuration.
readinessProbe:
  httpGet:
    path: /
    port: 8080

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

existingSecret: ""

# -- Pre-install/pre-upgrade hook Job that simulates a database migration.
migration:
  enabled: true
  image: busybox:1.36
  # Set to true to make the hook fail (used in Lab 10 to observe hook failures).
  fail: false

# -- Extra ConfigMaps rendered by the lab-common library. Map of name -> map of key/value.
extraConfigMaps: {}

# -- Secret created by this chart. Supply secret.data from an encrypted values file.
secret:
  create: false
  data: {}
