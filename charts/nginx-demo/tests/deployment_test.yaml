suite: deployment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secret.yaml
tests:
  - it: uses the replica count from values
    template: templates/deployment.yaml
    set:
      replicaCount: 4
    asserts:
      - equal:
          path: spec.replicas
          value: 4

  - it: omits replicas when autoscaling is enabled
    template: templates/deployment.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: builds the image from repository and tag
    template: templates/deployment.yaml
    set:
      image.repository: myrepo/web
      image.tag: "9.9"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myrepo/web:9.9

  - it: names the Deployment after the release
    template: templates/deployment.yaml
    release:
      name: shop
    asserts:
      - equal:
          path: metadata.name
          value: shop-deployment
      - equal:
          path: spec.selector.matchLabels.app
          value: shop

  - it: changes the config checksum when the page changes
    template: templates/deployment.yaml
    set:
      pageContent: "<h1>one</h1>"
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: "^[a-f0-9]{64}$"

  - it: renders extra env vars from a map
    template: templates/deployment.yaml
    set:
      extraEnv:
        LAB_NAME: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAB_NAME
            value: dev

  - it: does not reference a Secret by default
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: references an existing Secret
    template: templates/deployment.yaml
    set:
      existingSecret: my-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-secret

  - it: references the chart-created Secret and rolls pods when it changes
    template: templates/deployment.yaml
    release:
      name: shop
    set:
      secret.create: true
      secret.data.API_KEY: abc
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: shop-secret
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]
