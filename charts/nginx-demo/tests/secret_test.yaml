suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a Secret from secret.data
    release:
      name: shop
    set:
      secret.create: true
      secret.data:
        API_KEY: abc
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: shop-secret
      - equal:
          path: stringData.API_KEY
          value: abc

  - it: fails when create is true but data is empty
    set:
      secret.create: true
    asserts:
      - failedTemplate:
          errorMessage: secret.create is true but secret.data is empty

  - it: fails when both existingSecret and secret.create are set
    set:
      existingSecret: my-secret
      secret.create: true
      secret.data.API_KEY: abc
    asserts:
      - failedTemplate:
          errorPattern: set either existingSecret or secret.create, not both
