{{- if and .Values.secret .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop-db.credentialsSecret" . }}
  labels:
    {{- include "shop-db.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.password | default "shopdevpassword" | quote }}
  POSTGRES_USER: {{ .Values.user | quote }}
  POSTGRES_DB: {{ .Values.database | quote }}
{{- end }}
