name: chart-ci

on:
  pull_request:
    paths:
      - "charts/**"
      - "ct.yaml"
      - "ct/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ct compares against the target branch

      - uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2.7.0

      - name: Refuse unencrypted secrets files
        run: |
          shopt -s nullglob
          bad=0
          for f in charts/*/secrets.*.yaml; do
            if ! grep -q '^sops:' "$f"; then
              echo "::error file=$f::not SOPS-encrypted"
              bad=1
            fi
          done
          exit $bad

      - name: Build chart dependencies (nginx-demo first: shop packages it)
        run: |
          helm dependency build charts/nginx-demo
          helm dependency build charts/shop

      - name: Unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest
          helm unittest charts/nginx-demo charts/shop

      - name: Lint
        run: ct lint --config ct.yaml

      - name: Detect changed charts
        id: changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - uses: helm/kind-action@v1
        if: steps.changed.outputs.changed == 'true'

      - name: Install and test on a temporary cluster
        if: steps.changed.outputs.changed == 'true'
        run: ct install --config ct.yaml
